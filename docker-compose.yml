# Servidor, base de datos, n8n y HTTPS automático en una sola máquina.
# Uso: cp .env.example .env  (y completar)  →  docker compose up -d
services:
  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://widget:${POSTGRES_PASSWORD}@db:5432/widget
    depends_on: [db]
    mem_limit: 450m

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: widget
    volumes: [db:/var/lib/postgresql/data]

  n8n:
    image: n8nio/n8n:1.90.2
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMINIO}
      WEBHOOK_URL: https://${N8N_DOMINIO}/
      GENERIC_TIMEZONE: America/Lima
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes: [n8n:/home/node/.n8n]
    mem_limit: 2g

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMINIO: ${API_DOMINIO}
      N8N_DOMINIO: ${N8N_DOMINIO}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]

volumes: {db: {}, n8n: {}, caddy: {}}
